      <main>
        <h1>ARDC Nectar Research Cloud Eligibility Assessment</h1>
        <p>
          This tool determines your eligibility for ARDC Nectar Research Cloud
          compute resources for researchers in Australia and New Zealand.
        </p>
        <p>
          <strong
            >For the best experience, use the
            <a href="https://eligibility.rc.nectar.org.au"
              >interactive eligibility assessment tool</a
            ></strong
          >
          for a guided, step-by-step eligibility check with personalised results
          and direct links to apply.
        </p>

        <h2>How to determine your eligibility</h2>
        <ol>
          <li>
            <strong>Check your affiliation:</strong> Are you affiliated with an
            Australian university or research institution? If not, are you
            affiliated with the University of Auckland? If neither, you are not
            eligible for an allocation (but may access a 6-month project trial).
          </li>
          <li>
            <strong>Identify your funding:</strong> Are you or your
            collaborators funded by a national/international research grant, an
            NCRIS capability, a government grant, or an industry grant
            supporting research? If yes, you may be eligible for a
            <strong>national allocation</strong>.
          </li>
          <li>
            <strong>Check member organisation:</strong> If you have no
            qualifying funding, are you affiliated with an ARDC Nectar member
            organisation? If yes, you may be eligible for a
            <strong>local allocation</strong>. If no, you are
            <strong>not eligible</strong> for an allocation.
          </li>
        </ol>

        <h2>Eligibility Outcomes</h2>
        <h3>National Allocation</h3>
        <p>
          You may be eligible for a national allocation if you have an
          institutional affiliation AND qualifying research funding. Your
          request will be assessed by a Nectar representative.
        </p>

        <h3>Local Allocation</h3>
        <p>
          You may be eligible for a local allocation if you have an
          institutional affiliation, no qualifying funding, but are affiliated
          with an ARDC Nectar member organisation. Subject to your institution
          and local Nectar node's discretion.
        </p>

        <h3>Not Eligible</h3>
        <p>
          If you are not eligible for an allocation, you may still access the
          Nectar Cloud with a
          <a
            href="https://support.ehelp.edu.au/support/solutions/articles/6000068044"
            >6-month project trial</a
          >
          or use other ARDC services.
        </p>

        <h2>Requirements</h2>
        <p>For project allocations:</p>
        <ul>
          <li>
            <a
              href="https://support.ehelp.edu.au/support/solutions/articles/6000055377-getting-an-account"
              >AAF or Tuakiri account credentials</a
            >
          </li>
          <li>
            <a
              href="https://support.ehelp.edu.au/support/solutions/articles/6000277743"
              >Sensitive Data Guidelines</a
            >
            compliance
          </li>
          <li>
            <a
              href="https://support.ehelp.edu.au/support/solutions/articles/6000277260"
              >ORCID account</a
            >
            linked to your Nectar account
          </li>
          <li>Agreement to the terms of the service</li>
        </ul>

        <h2>Available Services</h2>
        <ul>
          <li>
            <a href="https://dashboard.rc.nectar.org.au/">Nectar Dashboard</a>
            — Fast, interactive, self-service cloud computing
          </li>
          <li>
            <a href="https://desktop.rc.nectar.org.au/"
              >Virtual Desktop Service</a
            >
            — Your extra computer in the cloud
          </li>
          <li>
            <a href="https://jupyterhub.rc.nectar.org.au"
              >Jupyter Notebook Service</a
            >
            — Develop code and computational output
          </li>
          <li>
            <a href="https://binderhub.rc.nectar.org.au/">BinderHub Service</a>
            — Make code repositories shareable and reproducible
          </li>
        </ul>

        <h2>Member Organisations</h2>
        <p>
          View the
          <a
            href="https://support.ehelp.edu.au/support/solutions/articles/6000264341"
            >full list of ARDC Nectar member organisations</a
          >.
        </p>

        <p>

            >Apply for an allocation</a
          >
          | <a href="https://support.ehelp.edu.au/">ARDC Support Centre</a>
        </p>
