              "@type": "Question",
              "name": "Who is eligible for an ARDC Nectar Research Cloud national allocation?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "You may be eligible for a national allocation if you are affiliated with an Australian university or research institution (or the University of Auckland), AND you or your collaborators are funded by a national or international research grant, an NCRIS capability (e.g. ARDC), a federal or state government department grant, or a grant from industry supporting research. You will also need AAF or Tuakiri credentials, must follow Sensitive Data Guidelines, link an ORCID account to your Nectar account, and agree to the terms of the service. Use the interactive assessment tool at https://eligibility.rc.nectar.org.au for a guided step-by-step eligibility check."
              }
            },
            {
              "@type": "Question",
              "name": "Who is eligible for an ARDC Nectar Research Cloud local allocation?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "You may be eligible for a local allocation if you are affiliated with an Australian university or research institution (or the University of Auckland), you do not have qualifying research funding, but you or your collaborators are affiliated with an ARDC Nectar member organisation. Local allocations are subject to your institution and the ARDC Nectar node's discretion. Use the interactive assessment tool at https://eligibility.rc.nectar.org.au for a guided step-by-step eligibility check."

              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Even if you are not eligible for a project allocation, you may still access the Nectar Cloud with a 6-month project trial or use other ARDC services (Virtual Desktop, Jupyter Notebook, BinderHub), provided you have AAF or Tuakiri credentials and agree to the terms of the service. Use the interactive assessment tool at https://eligibility.rc.nectar.org.au to check your options."
              }
            },
            {
              "@type": "Question",
              "name": "What are the requirements for using the ARDC Nectar Research Cloud?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "For project allocations: (1) AAF or Tuakiri account credentials, (2) follow the Sensitive Data Guidelines, (3) ORCID account linked to your Nectar account, (4) agree to the terms of the service. For project trials: (1) AAF or Tuakiri account credentials, (2) agree to the terms of the service."
              }
            },
            {
              "@type": "Question",
              "name": "Which organisations are ARDC Nectar member organisations?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "ARDC Nectar member organisations include universities and research institutions across Australia, grouped by node: Adelaide Node (The University of Adelaide (UofA), Flinders University, South Australian Health and Medical Research Institute (SAHMRI)), Intersect Node (The University of New South Wales (UNSW), Deakin University, La Trobe University, and others), Melbourne Node (The University of Melbourne (UoM), The Walter and Eliza Hall Institute of Medical Research (WEHI), Monash University, and others), Pawsey Node (Curtin University, The University of Western Australia (UWA), and others), QCIF Node (The University of Queensland (UQ), University of Southern Queensland (UniSQ), Griffith University, Queensland University of Technology (QUT), and others), UTAS Node (University of Tasmania (UTAS), Bureau of Meteorology (BOM) Research Centre), and independent nodes (University of Auckland (UoA), Swinburne University of Technology (SUT)). Visit https://support.ehelp.edu.au/support/solutions/articles/6000264341 for the full list."
              }

              "@type": "HowToStep",
