allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  # core-js only prints a funding banner from its postinstall; it was never
  # allowed under pnpm 10 either.
  core-js: false

# pnpm holds back versions younger than one day (minimumReleaseAge). Our own
# library is published to Verdaccio by CI on merge, and an uplift takes it the
# same day, so the ARDC packages are exempt.
minimumReleaseAgeExclude:
  - '@ardc-ui/*'
